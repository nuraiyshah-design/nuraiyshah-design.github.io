<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Für David</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="top-line"></div>

        <p class="small-intro">
            Für David
        </p>

        <h1>
            27 Jahre.
        </h1>

        <p class="subtitle">
            Und ein Mensch, der mein Leben schöner macht<br>
            und mir guttut.
        </p>


        <!--
            Hier entsteht das Herz
        -->

        <div id="heartContainer" aria-label="Interaktives Herz">
        </div>


        <div id="clickHint">
            Klick, wenn du bereit bist.
        </div>


        <!--
            Hier werden die 25 Gründe
            verteilt angezeigt.
        -->

        <div id="reasonsArea"></div>


        <div id="counter" class="counter">
        </div>


        <!--
            Finale
        -->

        <div id="finalMessage" class="final-message">

            <div class="final-small">
                Für dich.
            </div>

            <div class="final-title">
                Ich liebe dich,<br>
                mein Liebling.
            </div>

            <div class="final-line"></div>

            <div class="final-text">
                Und das sind nur einige der Gründe,<br>
                warum ich dich liebe.
            </div>

        </div>

    </main>


    <!--
        Herzregen am Ende
    -->

    <div id="heartRain"></div>


    <script src="script.js"></script>

</body>
</html>
